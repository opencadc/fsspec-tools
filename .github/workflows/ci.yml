# All required checks share one dependency graph.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, "migration/**"]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Check exact lockfile
        run: uv lock --check

      - name: Run all pre-commit hooks
        run: uv run --locked --all-packages pre-commit run --all-files --show-diff-on-failure

      - name: Build strict documentation
        run: uv run --locked --all-packages zensical build --strict --clean

      - name: Build every package
        run: uv build --no-sources --all-packages --out-dir dist

      - name: Check distribution metadata
        run: uv run --locked twine check --strict dist/*

  pr-title:
    name: Pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Check the title is a conventional commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: uv run --locked --only-group dev cz check --message "$TITLE"

  vosfs:
    name: vosfs
    uses: ./.github/workflows/reusable-package.yml
    with:
      package: vosfs
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  fss-cli:
    name: fss-cli
    uses: ./.github/workflows/reusable-package.yml
    with:
      package: fss-cli
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  artifacts:
    name: Installed artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Build, rebuild, and exercise isolated wheels
        run: uv run --locked --all-packages python libs/fss-cli/tests/_installed_wheel_gate.py

  required:
    name: Required
    if: always()
    needs: [quality, pr-title, vosfs, fss-cli, artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable check
        env:
          RESULTS: ${{ toJson(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          python - <<'PYTHON'
          import json
          import os
          import sys

          results = json.loads(os.environ["RESULTS"])
          failures = {
              name: job["result"]
              for name, job in results.items()
              if job["result"] != "success"
              and not (name == "pr-title" and os.environ["EVENT"] != "pull_request" and job["result"] == "skipped")
          }
          if failures:
              print(f"Required checks did not succeed: {failures}", file=sys.stderr)
              sys.exit(1)
          PYTHON
