# Bound to the pypi-vosfs and pypi-fss-cli Trusted Publishers.
name: Publish to PyPI

on:
  repository_dispatch:
    types: [pypi-release]
  workflow_dispatch:
    inputs:
      package:
        type: choice
        options: [vosfs, fss-cli]
        required: true
      tag:
        description: Existing package-vX.Y.Z release tag
        type: string
        required: true
      artifact_run_id:
        description: Prior publishing run whose exact distributions should be reused
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.client_payload.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.event.client_payload.package || inputs.package }}
    if: github.repository == 'opencadc/fsspec-tools' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi-${{ github.event.client_payload.package || inputs.package }}
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      PACKAGE: ${{ github.event.client_payload.package || inputs.package }}
      TAG: ${{ github.event.client_payload.tag_name || inputs.tag }}
      EXPECTED_SHA: ${{ github.event.client_payload.sha }}
      EVENT: ${{ github.event_name }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
    steps:
      - name: Check out publishing tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the release tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE" =~ ^(vosfs|fss-cli)$ ]] || exit 1
          [[ "$TAG" =~ ^${PACKAGE}-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          sha=$(git rev-parse "refs/tags/$TAG^{commit}")
          if [[ "$EVENT" == "repository_dispatch" && "$sha" != "$EXPECTED_SHA" ]]; then
            echo "Dispatch SHA does not match the release tag" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$sha" HEAD
          if [[ -n "$ARTIFACT_RUN_ID" ]]; then
            [[ "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
            prior=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID")
            [[ "$(jq -r '.path' <<<"$prior")" == ".github/workflows/pypi.yml" ]] || exit 1
            [[ "$(jq -r '.head_branch' <<<"$prior")" == "main" ]] || exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.release.outputs.sha }}
          path: release-source
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - name: Check release versions and lockfile
        working-directory: release-source
        run: |
          set -euo pipefail
          version=${TAG#"${PACKAGE}-v"}
          [[ "$(uv version --package "$PACKAGE" --short)" == "$version" ]] || exit 1
          [[ "$(jq -r --arg path "libs/$PACKAGE" '.[$path]' .release-please-manifest.json)" == "$version" ]] || exit 1
          uv lock --check

      - name: Build distributions
        if: inputs.artifact_run_id == ''
        working-directory: release-source
        run: uv build --no-sources --package "$PACKAGE" --out-dir ../dist

      - name: Recover retained distributions
        if: inputs.artifact_run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ env.PACKAGE }}-${{ steps.release.outputs.sha }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist

      - name: Validate distributions
        run: |
          uv run --locked twine check --strict dist/*
          python tools/release.py --dist dist --package "$PACKAGE" --version "${TAG#"${PACKAGE}-v"}" --index pypi

      - name: Retain distributions for recovery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ env.PACKAGE }}-${{ steps.release.outputs.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 90

      # The publisher creates attestations beside its uploads; keep dist unchanged.
      - name: Stage distributions for publication
        run: |
          mkdir publish-dist
          cp dist/*.whl dist/*.tar.gz publish-dist/

      - name: Wait five minutes before publishing
        run: sleep 300

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish-dist/
          attestations: true
          print-hash: true
          skip-existing: true # Existing files were checked against the retained hashes.

      - name: Verify published distributions
        run: |
          for attempt in 1 2 3 4 5 6; do
            if python tools/release.py --dist dist --package "$PACKAGE" \
              --version "${TAG#"${PACKAGE}-v"}" --index pypi --require-published; then
              exit 0
            fi
            sleep 10
          done
          echo "Published files could not be verified" >&2
          exit 1

      - name: Finalize the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_id=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq '.databaseId')
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id")
          for file in dist/*.whl dist/*.tar.gz; do
            name=${file##*/}
            asset=$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .id' <<<"$release")
            if [[ -n "$asset" ]]; then
              expected=$(sha256sum "$file" | cut -d ' ' -f 1)
              actual=$(gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset" \
                -H 'Accept: application/octet-stream' | sha256sum | cut -d ' ' -f 1)
              [[ "$expected" == "$actual" ]] || { echo "Conflicting release asset $name" >&2; exit 1; }
            else
              gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY"
            fi
          done
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
