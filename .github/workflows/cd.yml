name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    if: github.repository == 'opencadc/fsspec-tools'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Open release pull requests and cut releases
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Check out release note sources
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Preserve source links in the first release notes
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: python tools/release_notes.py

      - name: Dispatch vosfs publication
        if: steps.release.outputs['libs/vosfs--release_created'] == 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: pypi-release
          client-payload: |-
            {
              "package": "vosfs",
              "tag_name": "${{ steps.release.outputs['libs/vosfs--tag_name'] }}",
              "sha": "${{ steps.release.outputs['libs/vosfs--sha'] }}"
            }

      - name: Dispatch fss-cli publication
        if: steps.release.outputs['libs/fss-cli--release_created'] == 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: pypi-release
          client-payload: |-
            {
              "package": "fss-cli",
              "tag_name": "${{ steps.release.outputs['libs/fss-cli--tag_name'] }}",
              "sha": "${{ steps.release.outputs['libs/fss-cli--sha'] }}"
            }
