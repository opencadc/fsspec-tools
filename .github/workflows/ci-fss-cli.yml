name: fss-cli

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "libs/fss-cli/**"
  push:
    branches: [main]
    paths:
      - "libs/fss-cli/**"

permissions:
  contents: read

concurrency:
  group: fss-cli-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/reusable-package.yml
    with:
      package: fss-cli
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  artifacts:
    name: Installed artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      - name: Build, rebuild, and exercise isolated wheels
        run: uv run --locked --all-packages python libs/fss-cli/tests/_installed_wheel_gate.py
