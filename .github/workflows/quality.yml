# Repository-wide checks; package tests have their own path-filtered workflows.
name: Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Check exact lockfile
        run: uv lock --check

      - name: Run all pre-commit hooks
        run: uv run --locked --all-packages pre-commit run --all-files --show-diff-on-failure

      - name: Build strict documentation
        run: uv run --locked --all-packages zensical build --strict --clean

      - name: Build every package
        run: uv build --no-sources --all-packages --out-dir dist

      - name: Check distribution metadata
        run: uv run --locked twine check --strict dist/*

  pr-title:
    name: Pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Check the title is a conventional commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: uv run --locked --only-group dev cz check --message "$TITLE"

  required:
    name: Required
    if: always()
    needs: [quality, pr-title]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require repository quality checks
        env:
          QUALITY: ${{ needs.quality.result }}
          PR_TITLE: ${{ needs.pr-title.result }}
        run: |
          [[ "$QUALITY" == "success" ]] || { echo "Quality concluded $QUALITY" >&2; exit 1; }
          [[ "$PR_TITLE" == "success" || "$PR_TITLE" == "skipped" ]] || {
            echo "PR title concluded $PR_TITLE" >&2
            exit 1
          }
